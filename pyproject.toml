[project]
name = "zempel-rockauto-service"
version = "3.1.0"
description = "Production FastAPI proxy for RockAuto parts data with Neon PG audit logging"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "slowapi==0.1.9",
    "rockauto-api==1.0.0",
    "pydantic==2.11.3",
    "asyncpg==0.30.0",
    "httpx==0.28.1",
    "structlog==25.1.0",
    "python-dotenv==1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.25.3",
    "ruff==0.11.12",
    "mypy==1.15.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "S", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
