# ============================================================
# Render.com Deployment — Zempel RockAuto Proxy Service
# ============================================================
# Environment variables set via Render Dashboard:
#   DATABASE_URL          — Neon PG pooled connection string (sslmode=require)
#   SERVICE_AUTH_KEY      — API key for CF Worker → Python service auth
#   ALLOWED_ORIGINS       — Comma-separated allowed CORS origins
#   PORT                  — Auto-injected by Render
# ============================================================

services:
  - type: web
    name: zempel-rockauto-service
    runtime: docker
    dockerfilePath: ./python-service/Dockerfile
    dockerContext: ./python-service
    region: oregon
    plan: starter
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard — never commit
      - key: SERVICE_AUTH_KEY
        sync: false  # Set manually in Render dashboard
      - key: ALLOWED_ORIGINS
        value: "https://zempel-auto-crm.pages.dev,https://zempelauto.techguruofficial.us"
      - key: PYTHON_ENV
        value: production
    scaling:
      minInstances: 1
      maxInstances: 3
      targetMemoryPercent: 75
      targetCPUPercent: 70
